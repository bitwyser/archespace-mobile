name: archespace_mobile
description: "An open source, private space for everything you're working on. Your data is encrypted on your device, so the server never sees it."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # arc1 crypto port: Argon2id + AES-GCM (pure Dart).
  cryptography: ^2.7.0
  # Same backend as the web app (Auth, Postgres, RLS, Realtime).
  supabase_flutter: ^2.8.0
  # Biometric gate + OS keystore for the vault key.
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # Markdown rendering for the Markdown item type.
  flutter_markdown: ^0.7.4
  # Syntax highlighting for the Code item type (auto-detects the language).
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # Local filesystem path for the offline (ciphertext) cache.
  path_provider: ^2.1.4
  # Persisted appearance preferences (theme mode + accent).
  shared_preferences: ^2.3.0
  # PDF export + native share/print sheet.
  pdf: ^3.11.0
  printing: ^5.13.0
  # Save / open the JSON backup file.
  file_picker: ^8.1.0
  # Open the build-commit link on GitHub from Settings.
  url_launcher: ^6.3.2
  # QR code for two-factor auth (TOTP) enrolment.
  qr_flutter: ^4.1.0
  # Render the ArcheSpace logo (SVG) in the login screen and app bar.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the app launcher icons from the ArcheSpace mark.
  flutter_launcher_icons: ^0.14.1

# App launcher icon: a dark background with the mint A mark.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0d1117"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/fonts/DejaVuSansMono.ttf
